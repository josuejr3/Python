version: '3.9'
services:
  mysql_container:
    # env_file:
    # - .env
    container_name: mysql_container
    hostname: mysql_container
    image: mysql:8
    restart: no
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: senha
      MYSQL_DATABASE: base_de_dados
      MYSQL_USER: usuario
      MYSQL_PASSWORD: senha
      TZ: America/Sao_Paulo

volumes:
  mysql_data:
